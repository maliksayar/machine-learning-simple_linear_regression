<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Package Predictor</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e293b;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .badge-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .badge-algo {
            background-color: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
        }

        .badge-acc {
            background-color: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
            color: #0f172a;
        }

        input[type="number"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Highlights input red if user types an invalid number */
        input[type="number"]:invalid:not(:placeholder-shown) {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
            display: block;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        .result-box {
            margin-top: 28px;
            padding: 20px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            text-align: center;
           
        }

        .result-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #059669;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge-container">
            <span class="badge badge-algo">Simple Linear Regression</span>
            <span class="badge badge-acc">99% Accuracy</span>
        </div>

        <h2>Package Predictor</h2>
        <p class="subtitle">Enter your academic CGPA below to estimate your expected placement package in LPA.</p>

        <form action="#" method="post" id="predictForm">
            <div class="form-group">
                <label for="lpa">Enter your CGPA</label>
                <input 
                    type="number" 
                    id="lpa" 
                    name="lpa" 
                    placeholder="e.g., 8.50" 
                    min="1" 
                    max="10" 
                    step="0.01" 
                    required
                >
                <span class="hint">Allowed range: 1.00 to 10.00 CGPA</span>
            </div>

            <button type="submit">Predict Package</button>
        </form>

        <!-- Result Display -->
        <div class="result-box" id="resultBox">
            <div class="result-label">Estimated Package</div>
            <div class="result-value" id="predictionText">{{a}}</div>
        </div>
    </div>

    <script>
        // Automatically clean up NumPy array brackets like [[15.56417769]] from Flask
        document.addEventListener("DOMContentLoaded", function() {
            const resultBox = document.getElementById("resultBox");
            const predictionText = document.getElementById("predictionText");
            let rawValue = predictionText.innerText.trim();

            // Check if Flask passed a value (and it's not empty or raw Jinja tag)
            if (rawValue && rawValue !== "{{a}}" && rawValue !== "None") {
                // Remove brackets [ and ]
                let cleanNumber = parseFloat(rawValue.replace(/[\[\]]/g, ''));
                
                if (!isNaN(cleanNumber)) {
                    predictionText.innerText = cleanNumber.toFixed(2) + " LPA";
                    resultBox.style.display = "block";
                }
            }
        });
    </script>

</body>
</html>
